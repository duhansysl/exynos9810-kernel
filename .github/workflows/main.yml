name: DS-ACK Kernel Build Test

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y zstd git gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python-dev-is-python3 bsdiff wget

      - name: Download and Extract Clang Toolchain
        run: |
          # Create the toolchain directory matching the script's CR_TC path
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang-r522817
          
          # Download the r522817 toolchain archive
          echo "Downloading Clang r522817..."
          curl -Lo clang.tar.zst https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz
          
          # Extract using unzstd as performed in apollo.sh
          echo "Extracting toolchain..."
          tar --use-compress-program=unzstd -xf clang.tar.zst -C $GITHUB_WORKSPACE/toolchain/clang-r522817
          
          # Verify binary existence and set permissions
          if [ -f "$GITHUB_WORKSPACE/toolchain/clang-r522817/bin/ld.lld" ]; then
            echo "Verification Success: ld.lld found."
            chmod +x $GITHUB_WORKSPACE/toolchain/clang-r522817/bin/*
          else
            echo "ERROR: ld.lld not found in extracted directory!"
            exit 1
          fi
          
          rm clang.tar.zst

      - name: Set up Build Environment
        run: |
          # Create the "READY" file to skip the interactive first-time setup sudo prompt
          touch buildtools
          chmod +x apollo.sh

      - name: Execute Build Script (Interactive Bypass)
        run: |
          # Simulation sequence:
          # 7 -> Build All/ZIP
          # 3 -> Select Clang 18 (uses clang-r522817 folder)
          # 2 -> Selinux Enforcing
          # y -> Enable KernelSU
          # y -> Clean Build
          # y -> Build Flashable ZIP
          printf "7\n3\n2\ny\ny\ny" | ./apollo.sh

      - name: Upload Compiled Zips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Kernel-Zips
          path: Apollo/Product/*.zip
